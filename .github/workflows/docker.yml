name: docker

# 构建并推送 Docker 镜像到 GHCR：ghcr.io/<owner>/bangumi-auto-rename:latest
# 个人自用：web 分支 push / 手动触发，统一只推 :latest（不要版本号/sha/分支 tag）。
# docker pull ghcr.io/kafuuchino-s/bangumi-auto-rename:latest 永远拿 web 分支最新。
# 凭据：默认 GITHUB_TOKEN（packages: write 权限，下方 permissions 已声明）。
#
# 注意：本 workflow 只产 dev :latest（web 分支日常）。
# 正式版本化发布（多架构镜像 + Windows 便携 zip 挂 Release）走 release.yml（push v* tag 触发）。
# arm64 暂不支持：mwader/static-ffmpeg 的 ffprobe 来源 arm64 可用性未验证，留待后续。

on:
  push:
    branches: [web]
  workflow_dispatch:

env:
  # GHCR 镜像名：ghcr.io/<owner>/bangumi-auto-rename（只用 owner，不把仓库名塞进路径）。
  # owner 小写化（GHCR 要求小写，账号名含大写时强制转小写）。
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bangumi-auto-rename

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 小写化镜像名（GHCR 要求小写）
        run: |
          echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: 设置 QEMU（multi-arch 预留：当前仅 amd64，arm64 待 mwader/static-ffmpeg 验证后启用）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 :latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          # GitHub Actions 缓存加速（跨 run 复用层）
          cache-from: type=gha
          cache-to: type=gha,mode=max
