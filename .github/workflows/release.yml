name: release

# 正式版本化发布：打 v* tag 触发。
#   - docker job：amd64 build 推 GHCR（:latest + :vX.Y.Z + :sha-<short>）
#   - portable job：windows-latest 组装便携 zip 挂 GitHub Release
# docker.yml（web 分支日常）只推 dev :latest，与本 workflow 职责分离。
# arm64 暂不支持（mwader/static-ffmpeg 的 ffprobe arm64 来源未验证），留待后续。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release
  packages: write   # 推 GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bangumi-auto-rename

jobs:
  # ============================================================
  # docker：amd64 镜像，推 :latest + :vX.Y.Z + :sha-<short>
  # ============================================================
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 小写化镜像名（GHCR 要求小写）
        run: |
          echo "IMAGE_NAME=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: 设置 Docker Buildx（仅 amd64，QEMU 预留 multi-arch）
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析 tag 版本号
        id: ver
        run: |
          # tag 形如 v0.2.1 → 0.2.1；非 tag 触发用 sha
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送（amd64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.ver.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  # ============================================================
  # portable：Windows 便携 zip，挂 GitHub Release
  # ============================================================
  portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析 tag 版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-$(echo $GITHUB_SHA | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: 组装便携 zip
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pwsh scripts/build_windows_portable.ps1

      - name: 上传 artifact（便于非 tag 触发的手动验证）
        uses: actions/upload-artifact@v4
        with:
          name: BangumiAutoRename-win-x64-${{ steps.ver.outputs.version }}
          path: dist/BangumiAutoRename-win-x64-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error

      - name: 挂到 GitHub Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BangumiAutoRename-win-x64-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
