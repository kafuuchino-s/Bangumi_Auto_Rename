name: quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify release version baseline
        run: python scripts/check_release_version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=9,<10"

      - name: Compile Python sources
        run: python -m compileall src

      - name: Run unit and contract tests
        run: python -m pytest -m "not slow and not sample_pool and not e2e" -q

  sidecar:
    name: Pi sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check runner syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=(tools/pi_*_runner.mjs)
          if (( ${#files[@]} == 0 )); then
            echo "No Pi runner files found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Test shared runner runtime
        run: node --test tests/node/*.test.mjs

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check translations
        run: npm run i18n:check

      - name: Build
        run: npm run build
