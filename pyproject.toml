[project]
name = "Bangumi_Auto_Rename"
version = "0.2.1"
description = "Default template for PDM package"
authors = [
    {name = "KimigaiiWuyi", email = "444835641@qq.com"},
]
dependencies = [
    "tmdbsimple>=2.9.1",
    "jikanpy-v4>=1.0.2",
]
requires-python = ">=3.7"
readme = "README.md"
license = {text = "GPLv3"}


[tool.pdm]
distribution = false

[tool.isort]
profile = "black"
line_length = 79
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = ["typing_extensions"]