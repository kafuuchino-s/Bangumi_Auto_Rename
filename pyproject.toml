[project]
name = "Bangumi_Auto_Rename"
version = "0.3.0"
description = "Default template for PDM package"
authors = [{ name = "KimigaiiWuyi", email = "444835641@qq.com" }]
dependencies = [
    "tmdbsimple>=2.9.1",
    "pywin32>=308",
    "structlog>=24.4.0",
    "hachoir>=3.3.0",
    "rarfile>=4.0",
    "py7zr>=0.22.0",
    "ffsubsync>=0.4.30",
    "scrapling[fetchers]>=0.4.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.11.0",
    "requests>=2.31.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "diskcache>=5.6.0",
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = { text = "GPLv3" }


[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "src.start"

[[tool.pdm.source]]
name = "TUNA"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.basedpyright]
include = ["src", "tests", "tools"]
exclude = [
    ".venv",
    "data",
    "build",
    "dist",
    "__pycache__",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = true
reportMissingTypeStubs = false

executionEnvironments = [
    { root = "src" },
    { root = "tests", extraPaths = ["src"] },
    { root = "tools", extraPaths = ["src"] },
]

[tool.isort]
profile = "black"
line_length = 79
length_sort = true
skip_gitignore = true
force_sort_within_sections = true
extra_standard_library = ["typing_extensions"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "slow: slow or heavy tests that should not run in the default contract suite",
    "sample_pool: raw Local→Bangumi sample-pool fixtures or generated local runs",
    "e2e: end-to-end tests for manual/nightly validation",
]
